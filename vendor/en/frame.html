<!doctype html>
<html><head><meta charset="utf-8"><title>author runtime</title>
<script src="../../dist/frame-early.js"></script>
</head><body>
<!-- 以下骨架原样取自作者列表页 actions.html（已去掉其中的脚本标签） -->
<div class="overlay-noise ve-print__hidden"></div>

<div class="cancer__wrp-sidebar cancer__wrp-sidebar-lhs cancer__anchor"><div class="cancer__disp-cancer"></div><div class="cancer__sidebar-inner cancer__sidebar-inner--top cancer__wrp-interactive"><!--5ETOOLS_AD_LEFT_1--></div><div class="cancer__sidebar-inner cancer__sidebar-inner--bottom cancer__wrp-interactive"><!--5ETOOLS_AD_LEFT_2--></div></div>
<div class="cancer__wrp-sidebar cancer__wrp-sidebar-rhs cancer__anchor"><div class="cancer__disp-cancer"></div><div class="cancer__sidebar-inner cancer__sidebar-inner--top cancer__wrp-interactive"><!--5ETOOLS_AD_RIGHT_1--></div><div class="cancer__sidebar-inner cancer__sidebar-inner--bottom cancer__wrp-interactive"><!--5ETOOLS_AD_RIGHT_2--></div></div>

<div class="viewport-wrapper">
	<div class="cancer__wrp-leaderboard cancer__anchor"><div class="cancer__disp-cancer"></div><div class="cancer__wrp-leaderboard-inner cancer__wrp-interactive"><!--5ETOOLS_AD_LEADERBOARD--></div></div>

	<div class="ve-flex-col" data-cancer-id="cancer-header">
		<header class="ve-mobile-sm__hidden page__header">
			<div class="container ve-flex-v-baseline">
				<h1 class="page__title ve-no-wrap ve-my-0" id="page__title">Actions</h1>
				<p class="page__subtitle ve-no-wrap ve-my-0" id="page__subtitle">Search by name on the left, click a name to display on the right.</p>
			</div>
		</header>

		<nav class="container page__nav" id="navigation">
			<ul class="nav nav-pills page__nav-inner" id="navbar"></ul>
		</nav>
	</div>

	<div class="view-col-group--cancer ve-h-100 mh-0">
		<div class="container view-col-wrapper view-col-wrapper--cancer" data-cancer-id="cancer-wrapper">
			<div class="view-col" id="listcontainer">
				<div class="ve-lst__form-top" id="filter-search-group">
					<div class="ve-w-100 ve-relative">
						<input type="search" id="lst__search" autocomplete="off" autocapitalize="off" spellcheck="false" class="search ve-form-control ve-lst__search ve-lst__search--no-border-h">
						<div id="lst__search-glass" class="ve-lst__wrp-search-glass ve-no-events ve-flex-vh-center"><span class="glyphicon glyphicon-search"></span></div>
						<div class="ve-lst__wrp-search-visible ve-no-events ve-flex-vh-center"></div>
					</div>
					<button type="button" class="ve-btn ve-btn-default" id="reset">Reset</button>
				</div>

				<div id="filtertools" class="ve-input-group ve-input-group--bottom ve-flex ve-no-shrink">
					<button type="button" class="ve-col-0-3 ve-btn ve-btn-default ve-btn-xs ve-p-0 ve-lst__btn-collapse-all-previews ve-no-select" name="list-toggle-all-previews">[+]</button>
					<button type="button" class="ve-col-5-7 sort ve-btn ve-btn-default ve-btn-xs" data-sort="name">Name</button>
					<button type="button" class="ve-col-4 sort ve-btn ve-btn-default ve-btn-xs" data-sort="time">Time</button>
					<button type="button" class="sort ve-btn ve-btn-default ve-btn-xs ve-grow" data-sort="source">Source</button>
				</div>

				<div id="list" class="list list--stats"></div>
			</div>

			<div class="cancer__wrp-mobile-1 cancer__anchor"><div class="cancer__disp-cancer"></div><!--5ETOOLS_AD_MOB_PLAYER_1--></div>

			<div id="contentwrapper" class="view-col">
				<div id="sublistcontainer" class="sublist sublist--resizable ve-print__hidden">
					<div id="sublistsort" class="ve-btn-group sublist__wrp-cols">
						<button type="button" class="ve-col-8 sort ve-btn ve-btn-default ve-btn-xs" data-sort="name">Name</button>
						<button type="button" class="ve-col-4 sort ve-btn ve-btn-default ve-btn-xs" data-sort="time">Time</button>
					</div>

					<div id="sublist" class="list"></div>
				</div>

				<div class="ve-w-100 ve-flex ve-lst__wrp-stats-tabs" id="stat-tabs">
					<div class="ve-ml-auto ve-flex" id="tabs-right"></div>
				</div>

				<div id="wrp-pagecontent" class="ve-relative wrp-stats-table">
					<table id="pagecontent" class="ve-w-100 ve-stats">
						<tr><th class="ve-tbl-border" colspan="6"></th></tr>
						<tr><td colspan="6" class="initial-message initial-message--med">Select an entry from the list to view it here</td></tr>
						<tr><th class="ve-tbl-border" colspan="6"></th></tr>
					</table>
				</div>

				<div class="ve-flex-vh-center ve-mt-2 ve-print__hidden">
					<button type="button" class="ve-btn ve-btn-default ve-btn-xs ve-mr-2" id="btn-book">Printer View</button>
					<div class="ve-flex-v-center ve-btn-group" id="btngroup-manager">
						<button type="button" class="ve-btn ve-btn-xs ve-btn-primary" name="manage-content">Manage Content</button>
						<button type="button" class="ve-btn ve-btn-xs ve-btn-primary ve-w-24p" name="manage-prerelease" title="Manage Prerelease Content"><span class="glyphicon glyphicon-wrench"></span></button>
						<button type="button" class="ve-btn ve-btn-xs ve-btn-info ve-w-24p" name="manage-brew" title="Manage Homebrew"><span class="glyphicon glyphicon-glass"></span></button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="module" src="js/filter.js"></script>
<script type="module" src="js/utils-dataloader.js"></script>
<script type="module" src="js/utils-font.js"></script>
<script type="module" src="js/utils-brew.js"></script>

<script type="text/javascript" defer src="js/render.js"></script>
<script type="text/javascript" defer src="js/render-dice.js"></script>
<script type="text/javascript" defer src="js/render-markdown.js"></script>
<script type="module" src="js/shim-esmodules.js"></script>
<script type="text/javascript" defer src="js/hist.js"></script>
<script type="text/javascript" defer src="js/listpage.js"></script>
<script type="module" defer src="js/list2.js"></script>
<script type="text/javascript" defer src="lib/elasticlunr.js"></script>
<script type="module" src="../../dist/frame.js"></script>
</body></html>
